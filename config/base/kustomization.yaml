apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: quota-system

resources:
  - serviceaccount.yaml
  - serviceaccount-controller-manager.yaml
  - deployment.yaml
  - poddisruptionbudget.yaml
  - controller-manager-deployment.yaml
  - service.yaml
  # No Secret is defined here. With the postgres or dual backend, create
  # Secret quota-system/postgres-credentials yourself (dev overlays use
  # ../components/dev-postgres-credentials). Keys:
  #   dsn       Postgres connection string read by the apiserver and the
  #             migration Job, e.g. postgres://quota:<pw>@host:5432/quota?sslmode=verify-full
  #   password  the quota user's password, read by the bundled Postgres
  #             chart (config/components/postgres) only
  - rbac-auth-reader.yaml
  - rbac-cluster.yaml
  - rbac-controller-manager.yaml

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: quota
      app.kubernetes.io/instance: quota-apiserver
      app.kubernetes.io/component: apiserver
      app.kubernetes.io/part-of: quota.miloapis.com
      app.kubernetes.io/managed-by: kustomize

# Images (will be replaced by overlays for different environments)
images:
  - name: ghcr.io/datum-cloud/quota
    newTag: latest

# JSON patches to ensure rbac-auth-reader stays in kube-system
# These are applied AFTER all other transformations
patches:
  - target:
      kind: RoleBinding
      name: quota-apiserver-auth-reader
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: kube-system
      - op: replace
        path: /subjects/0/namespace
        value: quota-system
