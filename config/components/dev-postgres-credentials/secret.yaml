# DEV ONLY: see kustomization.yaml. sslmode=disable because the dev Postgres
# has no TLS; it is reachable only inside the kind cluster.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: quota-system
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: quota.miloapis.com
type: Opaque
stringData:
  dsn: "postgres://quota:devpassword@postgres-postgresql.quota-system.svc.cluster.local:5432/quota?sslmode=disable"
  password: "devpassword"
