apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: quota-apiserver
  namespace: quota-system
  labels:
    app: quota-apiserver
    app.kubernetes.io/name: quota
    app.kubernetes.io/component: apiserver
    monitoring: "true"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: quota
  endpoints:
    - port: https
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      # The apiserver authorizes /metrics like any other request: the
      # scraper's ServiceAccount needs the quota-metrics-reader ClusterRole.
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabelings:
        # Add pod name label
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        # Add node name label
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        # Add namespace label
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        # Add service name label
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: service
  namespaceSelector:
    matchNames:
      - quota-system
