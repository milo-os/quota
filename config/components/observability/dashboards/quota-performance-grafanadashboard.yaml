apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: quota-performance-dashboard
  labels:
    dashboards: grafana
    app.kubernetes.io/name: quota
    app.kubernetes.io/component: observability
spec:
  # Place this dashboard in a "Platform / Quota" folder in Grafana so it
  # shows up grouped with other datum platform dashboards.
  folder: "Platform / Quota"
  # Allow Grafana Operator to import this dashboard regardless of which
  # namespace the Grafana instance runs in.
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  # Polling period for configMapRef changes. Matches activity service pattern.
  resyncPeriod: 30s
  # The JSON lives in a ConfigMap produced by the configMapGenerator in
  # kustomization.yaml. The `key` must match the file name used with
  # `files:` in that generator.
  configMapRef:
    name: quota-performance-dashboard
    key: quota-performance.json
