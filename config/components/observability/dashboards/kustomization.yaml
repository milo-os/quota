apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace must match where the quota apiserver (and the Grafana-operator
# watch scope) lives. The parent Component at ../kustomization.yaml does not
# set a namespace because Components compose with whichever overlay they are
# attached to, but the ConfigMaps generated below must be addressable by the
# GrafanaDashboard CR via configMapRef, so we pin this subkustomization to
# quota-system.
namespace: quota-system

# The dashboard JSON is generated by `task observability:build-dashboards`
# from observability/dashboards/*.jsonnet. We embed it as a ConfigMap with
# the well-known `grafana_dashboard: "1"` label so Grafana Operator (and the
# sidecar discovery controller, if used) can pick it up automatically. The
# GrafanaDashboard CR below also references this ConfigMap explicitly via
# configMapRef for deterministic provisioning.
configMapGenerator:
  - name: quota-performance-dashboard
    files:
      - generated/quota-performance.json
    options:
      labels:
        grafana_dashboard: "1"
      # disableNameSuffixHash is required because the GrafanaDashboard CR
      # references the ConfigMap by a stable name via configMapRef.
      disableNameSuffixHash: true

resources:
  - quota-performance-grafanadashboard.yaml
