apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Performance tests run by the k6 operator (https://github.com/grafana/k6-operator).
#
# The ConfigMap below is generated from test/load/src/ via hack/bundle-k6.sh
# (run via `task -t test/load/Taskfile.yaml generate`). Do not edit the files
# under generated/ directly — they're auto-generated.
#
# Each TestRun is independent. Apply this component to a dev overlay and
# kick off a single test with:
#   kubectl create -f config/components/k6-performance-tests/testrun-throughput.yaml
# or apply all four to run them sequentially via cluster scheduling.

configMapGenerator:
  - name: quota-k6-test-scripts
    files:
      - generated/setup-tenants.js
      - generated/claim-throughput.js
      - generated/read-latency.js
      - generated/tenant-scale.js
    options:
      disableNameSuffixHash: true

resources:
  - rbac.yaml
  - testrun-setup.yaml
  - testrun-throughput.yaml
  - testrun-reads.yaml
  - testrun-scale.yaml

labels:
  - pairs:
      app.kubernetes.io/name: quota-k6-tests
      app.kubernetes.io/component: performance-testing
      app.kubernetes.io/part-of: quota.miloapis.com
