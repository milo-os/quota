apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: quota-perf-throughput
  namespace: quota-system
spec:
  parallelism: 1
  separate: false
  cleanup: post
  script:
    configMap:
      name: quota-k6-test-scripts
      file: claim-throughput.js
  runner:
    image: grafana/k6:latest
    serviceAccountName: quota-k6-runner
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi
    env:
      - name: QUOTA_API_URL
        value: "https://kubernetes.default.svc.cluster.local:443"
      - name: K6_INSECURE_SKIP_TLS_VERIFY
        value: "true"
      - name: TENANT_COUNT
        value: "50"
      - name: DEFINITION_COUNT
        value: "5"
      - name: VUS
        value: "20"
      - name: DURATION
        value: "2m"
