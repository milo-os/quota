apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# DEV/CI ONLY. RBAC for running the quota service in the datum-cloud/
# test-infra kind cluster:
#
#   - metrics-scraper.yaml lets the test-infra observability stack (every
#     ServiceAccount in telemetry-system) scrape /metrics.
#   - policy-targets.yaml gives the controller-manager read access to the
#     kinds the e2e suites' GrantCreationPolicies and ClaimCreationPolicies
#     trigger on (test/e2e).
#
# Requires config/components/observability for the quota-metrics-reader
# ClusterRole.
resources:
  - metrics-scraper.yaml
  - policy-targets.yaml
