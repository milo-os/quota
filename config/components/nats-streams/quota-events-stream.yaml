---
apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: quota-events
spec:
  # Stream name in NATS
  name: QUOTA_EVENTS

  # Subjects for quota events - hierarchical for filtering
  # Format: quota.<event_type>.<resource_kind>.<namespace>.<name>
  subjects:
    - quota.>

  # Retention policy: limits-based (time + size)
  retention: limits

  # Storage: file-based for durability
  storage: file

  # Maximum age: 7 days retention
  maxAge: 168h  # 7 days = 168 hours

  # Maximum bytes: 512MB (sufficient for quota events)
  maxBytes: 536870912  # 512 * 1024 * 1024

  # Number of replicas for high availability
  replicas: 1  # Can be increased to 3 for production HA

  # Discard policy when limits are reached
  discard: old

  # Allow direct access for queries
  allowDirect: true

  # Deduplication window
  duplicateWindow: 5m

  # Maximum number of consumers
  maxConsumers: 100

  # Maximum message size (256KB should be plenty for quota events)
  maxMsgSize: 262144  # 256 * 1024

  # No message limit - rely on age and size limits
  maxMsgs: -1

  # Require acknowledgments for durability
  noAck: false
