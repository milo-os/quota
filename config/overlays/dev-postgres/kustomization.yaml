apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: quota-system

resources:
  - ../../base
  - anonymous-rbac.yaml

components:
  - ../../components/namespace
  - ../../components/api-registration
  - ../../components/cert-manager-ca
  - ../../components/postgres                # Postgres DB via Bitnami chart
  - ../../components/postgres-migrations     # Migration Job
  - ../../components/nats-streams
  - ../../components/observability          # ServiceMonitors, alerts, dashboard (needs task dev:observability)
  - ../../components/dev-postgres-credentials
  - ../../components/test-infra-access
  - ../../components/enforcement-webhook

images:
  - name: ghcr.io/datum-cloud/quota
    newName: ghcr.io/datum-cloud/quota
    newTag: dev

patches:
  - path: patches/deployment-patch.yaml
  - path: patches/controller-manager-storage-backend.yaml

labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      environment: dev-postgres
