apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Performance-test deployment for the postgres backend. It is the dev-postgres overlay
# with config/components/perf-profile applied, so the three perf-* overlays
# differ only in storage backend. Used by .github/workflows/performance.yaml.

resources:
  - ../dev-postgres

components:
  - ../../components/perf-profile
