apiVersion: quota.miloapis.com/v1alpha1
kind: ClaimCreationPolicy
metadata:
  name: mc-test-secret-claim-policy
  labels:
    test.miloapis.com/quota: "multicluster"
spec:
  disabled: false
  trigger:
    resource:
      apiVersion: "v1"
      kind: "Secret"
    constraints:
      - expression: 'has(trigger.metadata.labels) && "test.miloapis.com/quota" in trigger.metadata.labels && trigger.metadata.labels["test.miloapis.com/quota"] == "multicluster"'
  target:
    resourceClaimTemplate:
      metadata:
        namespace: "{{requestInfo.namespace}}"
        labels:
          quota.miloapis.com/test: "true"
          test.miloapis.com/quota: "multicluster"
      spec:
        consumerRef:
          apiGroup: ""
          kind: "Namespace"
          name: "{{requestInfo.namespace}}"
        requests:
          - resourceType: "test.multicluster.miloapis.com/secrets"
            amount: 1
