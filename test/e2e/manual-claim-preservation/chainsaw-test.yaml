apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: quota-manual-claim-preservation
spec:
  description: |
    Verifies that manually created QuotaClaims are not garbage-collected by the
    QuotaClaim ownership controller (regression test for issue #642).

    Before the fix, the controller incorrectly processed any QuotaClaim with
    Granted=True and no owner references, including service-managed claims whose
    owning resource lives in a different control plane. It would enter a continuous
    delete-recreate loop once the orphan grace period elapsed.

    This test creates a QuotaClaim without the admission-plugin auto-created
    markers (quota.miloapis.com/auto-created=true and
    quota.miloapis.com/created-by=claim-creation-plugin) and a resourceRef that
    points to a non-existent ConfigMap. Before the fix, the controller would delete
    this claim after the orphan max-age (default 30s). After the fix, the controller
    skips it entirely because the auto-created markers are absent.

  steps:
    - name: setup-quota-definition
      description: |
        Register the resource type used by this test. The registration must be active
        before the quota system can evaluate claims for this resource type.
      try:
        - description: Create QuotaDefinition for the test quota type
          create:
            file: 01-quota-definition.yaml
        - description: Wait for QuotaDefinition to become active
          wait:
            apiVersion: quota.miloapis.com/v1alpha1
            kind: QuotaDefinition
            name: manual-claim-test-definition
            timeout: 30s
            for:
              condition:
                name: Active
                value: 'True'

    - name: setup-namespace
      description: |
        Create the Namespace that acts as the quota consumer. The ownership
        controller runs cluster-wide, so a plain Namespace is sufficient.
      try:
        - description: Create test Namespace
          create:
            file: 02-namespace.yaml
        - description: Wait for the Namespace to become active
          wait:
            apiVersion: v1
            kind: Namespace
            name: quota-e2e-manual-claim
            timeout: 30s
            for:
              jsonPath:
                path: '{.status.phase}'
                value: Active

    - name: setup-quota-grant
      description: |
        Grant quota to the Namespace so the manually created claim can be
        evaluated and granted. Without available quota the claim would be denied
        rather than granted, and the ownership controller would not process it.
      try:
        - description: Create QuotaGrant for the test Namespace
          create:
            file: 03-quota-grant.yaml
        - description: Wait for QuotaGrant to become active
          wait:
            apiVersion: quota.miloapis.com/v1alpha1
            kind: QuotaGrant
            name: manual-claim-test-grant
            namespace: quota-e2e-manual-claim
            timeout: 30s
            for:
              condition:
                name: Active
                value: 'True'

    - name: create-manual-claim-and-wait-for-grant
      description: |
        Create a QuotaClaim that is missing the auto-created label and annotation
        normally set by the admission plugin. The resourceRef points to a ConfigMap that
        does not exist — without the fix this is what triggers the ownership controller
        to eventually delete the claim after the orphan grace period elapses.
      try:
        - description: Create manual QuotaClaim without auto-created markers
          create:
            file: 04-manual-quota-claim.yaml
        - description: Wait for the claim to reach Granted=True
          wait:
            apiVersion: quota.miloapis.com/v1alpha1
            kind: QuotaClaim
            name: manual-claim-test-claim
            namespace: quota-e2e-manual-claim
            timeout: 30s
            for:
              condition:
                name: Granted
                value: 'True'

    - name: verify-claim-not-garbage-collected
      description: |
        Sleep past the ownership controller's default orphan max-age threshold (30s)
        then assert the claim still exists with Granted=True. Before issue #642 was
        fixed, the controller would have deleted this claim because it had no owner
        references and its resourceRef pointed to a non-existent ConfigMap.
      try:
        - description: Wait past the default orphan max-age (30s)
          sleep:
            duration: 35s
        - description: Assert the manually created claim was not garbage-collected
          wait:
            apiVersion: quota.miloapis.com/v1alpha1
            kind: QuotaClaim
            name: manual-claim-test-claim
            namespace: quota-e2e-manual-claim
            timeout: 10s
            for:
              condition:
                name: Granted
                value: 'True'
