apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: quota-grant-creation-policy
spec:
  description: |
    Tests GrantCreationPolicy functionality for automatic QuotaGrant generation.

    This test verifies:
    - GrantCreationPolicies automatically create QuotaGrants when matching resources are created
    - CEL template expressions correctly render grant specifications
    - CEL name expressions generate dynamic grant names
    - Condition evaluation updates grants when trigger resources change
    - Owner references ensure grants are cleaned up when triggers are deleted
    - Production-style label validation works correctly
    - Invalid policy configurations are rejected

  steps:
    # Setup base quota infrastructure - MUST be first
    - name: setup-base-infrastructure
      description: Register the resource type for grant creation testing
      try:
        - apply:
            file: 01-resource-registration.yaml
        - wait:
            apiVersion: quota.miloapis.com/v1alpha1
            kind: QuotaDefinition
            name: grant-policy-test-projects-per-org
            timeout: 30s
            for:
              condition:
                name: Active
                value: 'True'
        - assert:
            file: assertions/assert-resource-registration.yaml

    # Create and validate grant creation policy
    - name: setup-grant-creation-policy
      description: |
        Create GrantCreationPolicy that automatically generates QuotaGrants for Namespaces.
        The policy uses CEL templates to compute grant amounts based on namespace attributes.
      try:
        - apply:
            file: grant-creation-policy.yaml
        - wait:
            apiVersion: quota.miloapis.com/v1alpha1
            kind: GrantCreationPolicy
            name: test-organization-grant-policy
            timeout: 30s
            for:
              condition:
                name: Ready
                value: 'true'
        - assert:
            file: assertions/assert-grant-creation-policy.yaml

    # Create basic namespace that will trigger grant creation
    - name: setup-test-namespace
      description: |
        Create a Namespace that matches the GrantCreationPolicy selector.
        This should trigger automatic QuotaGrant creation.
      try:
        - apply:
            file: 02-test-namespace.yaml
        - wait:
            apiVersion: v1
            kind: Namespace
            name: grant-policy-test-org
            timeout: 30s
            for:
              jsonPath:
                path: '{.status.phase}'
                value: Active
        - assert:
            file: assertions/assert-organization.yaml

    # Verify automatic grant creation
    - name: verify-automatic-grant-creation
      description: |
        Verify that QuotaGrant was automatically created by the GrantCreationController.
        The grant should be Active and have the correct spec from the policy template.
      try:
        - assert:
            timeout: 60s
            file: assertions/assert-automatic-grant.yaml

    # Test policy condition evaluation with namespace update
    - name: test-condition-evaluation
      description: |
        Update the Namespace's attributes to trigger grant recalculation.
        The policy should update the grant based on the new CEL template evaluation.
      try:
        - apply:
            file: test-data/namespace-update-tier.yaml
        - assert:
            timeout: 60s
            file: assertions/assert-updated-grant.yaml

    # Test template rendering with different context
    - name: test-template-rendering
      description: |
        Create a Namespace with different attributes (premium tier).
        Verify that the policy generates a grant with different values based on CEL template evaluation.
      try:
        - apply:
            file: test-data/premium-namespace.yaml
        - wait:
            apiVersion: v1
            kind: Namespace
            name: premium-test-org
            timeout: 30s
            for:
              jsonPath:
                path: '{.status.phase}'
                value: Active
        - assert:
            timeout: 60s
            file: assertions/assert-premium-grant.yaml

    # Test policy with CEL name expression
    - name: test-cel-name-expression
      description: |
        Test GrantCreationPolicy with CEL expression for dynamic grant naming.
        The grant name should be generated from CEL template evaluation.
      try:
        - apply:
            file: cel-name-policy.yaml
        - wait:
            apiVersion: quota.miloapis.com/v1alpha1
            kind: GrantCreationPolicy
            name: test-cel-name-policy
            timeout: 30s
            for:
              condition:
                name: Ready
                value: 'true'
        - apply:
            file: test-data/cel-trigger-namespace.yaml
        - wait:
            apiVersion: v1
            kind: Namespace
            name: cel-trigger-org
            timeout: 30s
            for:
              jsonPath:
                path: '{.status.phase}'
                value: Active
        - assert:
            timeout: 60s
            file: assertions/assert-cel-named-grant.yaml

    # Test grant cleanup when trigger is deleted
    - name: test-grant-cleanup
      description: |
        Verify that QuotaGrants are automatically deleted when their trigger resource is removed.
        This validates owner reference-based garbage collection.
      try:
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: grant-policy-test-org
        - wait:
            apiVersion: quota.miloapis.com/v1alpha1
            kind: QuotaGrant
            name: auto-grant-grant-policy-test-org
            namespace: grant-policy-test-org
            timeout: 30s
            for:
              deletion: {}
        - assert:
            file: assertions/assert-grant-cleanup.yaml

    # Test policy validation errors
    - name: test-policy-validation
      description: |
        Test that invalid GrantCreationPolicy configurations are rejected by validation.
      try:
        - apply:
            file: test-data/invalid-policy.yaml
            expect:
              - check:
                  ($error != null): true
        - assert:
            file: assertions/assert-grant-creation-policy.yaml

    # Test production-style labels (the bug fix validation)
    - name: test-production-style-labels
      description: |
        Test that GrantCreationPolicy accepts production-style label selectors with prefixes.
        This validates a bug fix for label validation in CEL expressions.
      try:
        - apply:
            file: production-style-labels-policy.yaml
        - wait:
            apiVersion: quota.miloapis.com/v1alpha1
            kind: GrantCreationPolicy
            name: test-production-style-labels-policy
            timeout: 30s
            for:
              condition:
                name: Ready
                value: 'true'
        - assert:
            file: assertions/assert-production-style-labels-ready.yaml

    # Test namespace template grant creation
    - name: test-namespace-template-grant
      description: |
        Test that GrantCreationPolicy can create grants in consumer-specific namespaces
        using namespace templates like '{{.trigger.metadata.name}}'.
      try:
        - apply:
            file: namespace-template-policy.yaml
        - wait:
            apiVersion: quota.miloapis.com/v1alpha1
            kind: GrantCreationPolicy
            name: test-namespace-template-policy
            timeout: 30s
            for:
              condition:
                name: Ready
                value: 'true'
        - apply:
            file: test-data/namespace-template-namespace.yaml
        - wait:
            apiVersion: v1
            kind: Namespace
            name: namespace-template-test-org
            timeout: 30s
            for:
              jsonPath:
                path: '{.status.phase}'
                value: Active
        - assert:
            timeout: 60s
            file: assertions/assert-namespace-template-grant.yaml

    # Clean up remaining test namespaces
    - name: cleanup-test-namespaces
      description: Delete remaining test namespaces to clean up state.
      try:
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: premium-test-org
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: cel-trigger-org
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: namespace-template-test-org
