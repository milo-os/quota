apiVersion: quota.miloapis.com/v1alpha1
kind: GrantCreationPolicy
metadata:
  name: test-organization-grant-policy
  labels:
    test.miloapis.com/quota: "grant-creation-policy"
spec:
  disabled: false
  trigger:
    resource:
      apiVersion: "v1"
      kind: "Namespace"
    constraints:
      # Trigger for Standard-tier namespaces in the grant-creation-policy test suite
      # This may overlap with cel-name-policy for premium-test-org (intentional for testing)
      - expression: 'has(trigger.metadata.labels) && "quota.miloapis.com/test-tier" in trigger.metadata.labels && trigger.metadata.labels["quota.miloapis.com/test-tier"] == "standard" && "test.miloapis.com/scenario" in trigger.metadata.labels && trigger.metadata.labels["test.miloapis.com/scenario"] == "grant-creation-policy"'
  target:
    resourceGrantTemplate:
      metadata:
        name: "auto-grant-{{.trigger.metadata.name}}"
        namespace: "{{.trigger.metadata.name}}"
        labels:
          quota.miloapis.com/auto-created: "true"
          quota.miloapis.com/policy: "test-organization-grant-policy"
          test.miloapis.com/scenario: "grant-creation-policy"
        annotations:
          quota.miloapis.com/description: "Auto-generated grant for {{.trigger.metadata.name}}"
      spec:
        consumerRef:
          apiGroup: ""
          kind: "Namespace"
          name: "{{.trigger.metadata.name}}"
        allowances:
          - resourceType: "test.grantpolicy.miloapis.com/projects"
            buckets:
              - amount: 5
