apiVersion: quota.miloapis.com/v1alpha1
kind: QuotaGrant
metadata:
  name: pre-created-test-org-grant-2
  namespace: quota-e2e-pre-created
spec:
  consumerRef:
    kind: Namespace
    apiGroup: ""
    name: quota-e2e-pre-created
  allowances:
    - resourceType: "pre-created-test/projects-per-org"
      buckets:
        - amount: 2  # Additional 2 projects
    - resourceType: "pre-created-test/cpu-per-org"
      buckets:
        - amount: 2000  # Additional 2 cores in millicores
