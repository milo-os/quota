version: '3'

vars:
  # Resolve to the repo root regardless of where 'task' is invoked from.
  # TASKFILE_DIR is the absolute path to test/load/, so ../.. is the repo root.
  ROOT_DIR: '{{.TASKFILE_DIR}}/../..'
  K6_SRC_DIR: '{{.ROOT_DIR}}/test/load/src'
  RESULTS_DIR: '{{.ROOT_DIR}}/test/load/results'
  KUBECONFIG: '{{.KUBECONFIG | default ".test-infra/kubeconfig"}}'
  PROXY_PORT: '{{.PROXY_PORT | default "8001"}}'
  QUOTA_API_URL: '{{.QUOTA_API_URL | default "http://localhost:8001"}}'

tasks:
  default:
    desc: List load test tasks
    cmds:
      - task --list
    silent: true

  validate:
    desc: Lint all k6 scripts with k6 inspect
    silent: true
    cmds:
      - |
        set -e
        if ! command -v k6 >/dev/null 2>&1; then
          echo "ERROR: k6 not installed. brew install k6 (macOS) or see https://k6.io/docs/get-started/installation/" >&2
          exit 1
        fi
        for f in {{.K6_SRC_DIR}}/*.js; do
          name=$(basename "$f")
          if k6 inspect "$f" >/dev/null 2>&1; then
            echo "  ok  $name"
          else
            echo "  FAIL $name"
            k6 inspect "$f"
            exit 1
          fi
        done

  generate:
    desc: Bundle k6 scripts and refresh the kustomize component (config/components/k6-performance-tests/generated)
    silent: true
    cmds:
      - ROOT_DIR={{.ROOT_DIR}} {{.ROOT_DIR}}/hack/bundle-k6.sh
      - |
        echo ""
        echo "Validating bundled scripts..."
        for f in {{.ROOT_DIR}}/config/components/k6-performance-tests/generated/*.js; do
          name=$(basename "$f")
          if k6 inspect "$f" >/dev/null 2>&1; then
            echo "  ok  $name"
          else
            echo "  FAIL $name"
            k6 inspect "$f"
            exit 1
          fi
        done

  k6:install-operator:
    desc: Install the k6 operator into the cluster (one-time setup)
    silent: true
    cmds:
      - |
        set -e
        echo "Installing k6 operator..."
        KUBECONFIG={{.KUBECONFIG}} kubectl apply --server-side -f https://github.com/grafana/k6-operator/releases/download/v0.0.20/bundle.yaml
        KUBECONFIG={{.KUBECONFIG}} kubectl wait --for=condition=Available deployment/k6-operator-controller-manager -n k6-operator-system --timeout=120s

  k6:apply:
    desc: Apply the k6 performance tests component to the running cluster
    silent: true
    cmds:
      - KUBECONFIG={{.KUBECONFIG}} kubectl apply -k {{.ROOT_DIR}}/config/components/k6-performance-tests/

  k6:run:
    desc: 'Trigger a single TestRun. Vars: TEST=setup|throughput|reads|scale'
    silent: true
    cmds:
      - |
        set -e
        TEST="{{.TEST | default "throughput"}}"
        case "$TEST" in
          setup|throughput|reads|scale) ;;
          *) echo "ERROR: TEST must be one of: setup, throughput, reads, scale" >&2; exit 1 ;;
        esac
        # Delete any prior run with the same name so we can re-run
        KUBECONFIG={{.KUBECONFIG}} kubectl delete testrun.k6.io/quota-perf-${TEST} -n quota-system --ignore-not-found
        KUBECONFIG={{.KUBECONFIG}} kubectl apply -f {{.ROOT_DIR}}/config/components/k6-performance-tests/testrun-${TEST}.yaml
        echo ""
        echo "TestRun quota-perf-${TEST} created. Watch progress with:"
        echo "  kubectl get testrun -n quota-system -w"
        echo "  kubectl logs -n quota-system -l k6_cr=quota-perf-${TEST} -f"

  k6:logs:
    desc: 'Tail logs from a TestRun. Vars: TEST=setup|throughput|reads|scale'
    silent: true
    cmds:
      - |
        TEST="{{.TEST | default "throughput"}}"
        KUBECONFIG={{.KUBECONFIG}} kubectl logs -n quota-system -l k6_cr=quota-perf-${TEST} -f --tail=200

  proxy:
    desc: Run kubectl proxy in foreground (use in a separate terminal before running tests)
    cmds:
      - KUBECONFIG={{.KUBECONFIG}} kubectl proxy --port={{.PROXY_PORT}}

  setup:
    desc: 'Provision tenants for performance testing. Vars: TENANT_COUNT, DEFINITION_COUNT, GRANT_AMOUNT'
    silent: true
    cmds:
      - |
        mkdir -p {{.RESULTS_DIR}}
        k6 run \
          -e QUOTA_API_URL={{.QUOTA_API_URL}} \
          -e TENANT_COUNT={{.TENANT_COUNT | default "50"}} \
          -e DEFINITION_COUNT={{.DEFINITION_COUNT | default "5"}} \
          -e GRANT_AMOUNT={{.GRANT_AMOUNT | default "100"}} \
          --summary-export={{.RESULTS_DIR}}/setup.json \
          {{.K6_SRC_DIR}}/setup-tenants.js

  throughput:
    desc: 'Measure claim creation throughput. Vars: VUS, DURATION, TENANT_COUNT'
    silent: true
    cmds:
      - |
        mkdir -p {{.RESULTS_DIR}}
        k6 run \
          -e QUOTA_API_URL={{.QUOTA_API_URL}} \
          -e TENANT_COUNT={{.TENANT_COUNT | default "50"}} \
          -e DEFINITION_COUNT={{.DEFINITION_COUNT | default "5"}} \
          -e VUS={{.VUS | default "20"}} \
          -e DURATION={{.DURATION | default "2m"}} \
          --summary-export={{.RESULTS_DIR}}/throughput.json \
          {{.K6_SRC_DIR}}/claim-throughput.js

  reads:
    desc: 'Measure read latency under tenant scale. Vars: VUS, DURATION, TENANT_COUNT'
    silent: true
    cmds:
      - |
        mkdir -p {{.RESULTS_DIR}}
        k6 run \
          -e QUOTA_API_URL={{.QUOTA_API_URL}} \
          -e TENANT_COUNT={{.TENANT_COUNT | default "50"}} \
          -e DEFINITION_COUNT={{.DEFINITION_COUNT | default "5"}} \
          -e VUS={{.VUS | default "10"}} \
          -e DURATION={{.DURATION | default "2m"}} \
          --summary-export={{.RESULTS_DIR}}/reads.json \
          {{.K6_SRC_DIR}}/read-latency.js

  scale:
    desc: 'Walk through increasing tenant counts and measure at each step'
    silent: true
    cmds:
      - |
        mkdir -p {{.RESULTS_DIR}}
        k6 run \
          -e QUOTA_API_URL={{.QUOTA_API_URL}} \
          -e TENANT_STEPS={{.TENANT_STEPS | default "10,50,100,250,500"}} \
          -e DEFINITION_COUNT={{.DEFINITION_COUNT | default "5"}} \
          -e GRANT_AMOUNT={{.GRANT_AMOUNT | default "1000"}} \
          -e STEP_OPS={{.STEP_OPS | default "200"}} \
          --summary-export={{.RESULTS_DIR}}/scale.json \
          --out json={{.RESULTS_DIR}}/scale-raw.json \
          {{.K6_SRC_DIR}}/tenant-scale.js

  cleanup:
    desc: 'Delete all perf test tenants and definitions'
    silent: true
    cmds:
      - |
        set -e
        echo "Deleting perf test namespaces..."
        KUBECONFIG={{.KUBECONFIG}} kubectl get ns -o name | grep '^namespace/quota-perf-tenant-' | xargs -r KUBECONFIG={{.KUBECONFIG}} kubectl delete --wait=false || true
        echo "Deleting perf test definitions..."
        KUBECONFIG={{.KUBECONFIG}} kubectl get quotadefinitions -o name | grep '^quotadefinition.quota.miloapis.com/perf-def-' | xargs -r KUBECONFIG={{.KUBECONFIG}} kubectl delete || true
        echo "Cleanup complete."
